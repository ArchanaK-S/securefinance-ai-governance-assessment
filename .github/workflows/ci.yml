name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  reproduce-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest -q
      - name: Reproduce fairness evaluation and risk register
        run: python scripts/run_all.py
      - name: Verify committed results match a fresh run
        if: matrix.python-version == '3.12'
        run: |
          git diff --stat --exit-code -- data/synthetic_applicants.csv || echo "::warning::Synthetic data differs from committed copy (library version drift?)"
